model: molf
debug: false
PFM_name: conch
batch_size: 1
num_epochs: 400
lr: 5e-5
weight_decay: 0.01
dropout_rate: 0.1
attention_type: standard # standard, i used to have flash attention 
spatial_encoding:
  use_spatial_encoding: true
  spatial_transformer_heads: 4
  spatial_transformer_layers: 1
  use_sequence_positional_encoding: false
gene_autoencoder: # not used when gene_vae_pretrained_path is provided
  n_heads: 4
  n_layers: 1
  model_dim: 128
  latent_dim: 32
gene_vae_pretrained_path: 
  /data/cat/ws/rzmi154h-molf-pathology/conch_molf_production/genevae_v2_frozen
hidden_dim: 256
onco_onehot_dim: 29
early_stop_patience: 80
cross_attn_heads: 4
loss_config:
  flow_loss_weight: 1.
  gene_loss_weight: 1.
  kl_loss_weight: 1e-6
  load_balancing_loss_weight: 0.01
mixture_of_expert:
  use_moe: true
  num_experts: 6
  expert_dim: 256
  expert_heads: 4
  expert_layers: 1
  moe_dropout: 0.1
  top_k: 2
  gating_lr: 5e-05
velocity_head: # when not using MoE, this is just a standard transformer decoder
  model_dim: 256 # num_experts * expert_dim
  n_head: 4
CFG_params:
  # CFG_scale: 3.0 # 1.0 means no CFG, >1.0 amplifies the conditioning, <1.0 reduces the conditioning, only matters for sampling
  CFG_dropout: 0.1
paths_config:
  metadata_path: data/Hest_Bench/HEST_v1_1_0.csv
  gene_list_path: data/Hallmark/Hallmark_n_HVG50_genes.yaml
  path_way_dict_path: data/Hallmark/final_hallmark_genes.pkl
  patches_path: 
    /data/cat/ws/rzmi154h-molf-pathology/conch_molf_production/patch_meta
  root: data/hest_data/
  wsis_path: data/hest_data/wsis/
  splits_path: data/Hest_Bench/hest_pathway_clean_split_0
  st_path: /data/cat/ws/rzmi154h-molf-pathology/conch_molf_production/st
  embeddings_path: data/HEST1K/conch
  oncotree_vocab_path: 
    /data/cat/ws/rzmi154h-molf-pathology/conch_molf_production/metadata/run2_oncotree_code_list.txt
comments: 'CONCH-MoLF Run 2 corrected/optimized: frozen GeneVAE-v2 epoch 929, posterior-sampled
  latent target, filled OncoTree labels, deterministic MC validation, shuffled training,
  permutation-equivariant patch context, unit Gaussian flow source, normalized top-k
  load balance, cosine schedule'
wandb_project_name: MoLF_clean_code
training_seed: 2025
detect_anomaly: false
wandb_enabled: false
num_workers: 6
early_stop_min_delta: 0.0001
scheduler:
  type: cosine_with_warmup
  warmup_fraction: 0.05
validation:
  mc_repeats: 5
  seed: 31001
gene_vae_format: GeneVAE-v2
gene_vae_checkpoint_file: genevae_v2_best_epoch929.pt
gene_vae_checkpoint_sha256: 
  cf58dafe7e37987fb24a046676a1a04a24a2c992fb74eeef4203840d48f00cc6
gene_vae_config_sha256: 
  3f7a1380fa1033504ca4a6f1c3ba1e5f7cad5e527addaf1578d88e5d579410d9
gene_vae_expected_human_epoch: 929
gene_vae_expected_n_genes: 1386
gene_vae_expected_latent_dim: 128
gene_vae_latent_target: posterior_sample
