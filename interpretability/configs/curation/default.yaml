input_path: data/cache/harvest/all_raw_concepts.parquet
output_dir: data/cache/concept_bank/harvested
stage_cache_dir: data/cache/curation/stages
calibrated_thresholds_path: configs/curation/calibrated_thresholds.yaml
llm_verification_sample_rate: 0.0
llm_verification_seed: 42
llm_adjudicate_keeps_too: true

sapbert:
  model_name: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  max_length: 25
  batch_size: 128
  device: auto
  cache_dir: data/cache/sapbert

dedup:
  similarity_threshold: 0.85
  method: hdbscan
  min_cluster_size: 2
  gene_overlap_threshold: 0.5
  canonical_source_priority:
    - snomed
    - ncit
    - cell_ontology
    - gene_ontology
    - msigdb_h.all
    - msigdb_c2.cp.reactome
    - msigdb_c2.cp.kegg_legacy
    - pubmed

visual_filter:
  reference_bank_dir: data/cache/concept_bank/reference
  similarity_keep_threshold: 0.55
  similarity_drop_threshold: 0.35
  reference_centroid_method: mean
  topk: 5
  per_tier_thresholds: {}
  knn_k: 10
  knn_batch_size: 256

llm:
  enabled: true
  base_url: http://localhost:11434
  model: qwen2.5:3b-instruct
  timeout_seconds: 60.0
  max_concurrent: 1
  batch_size: 8
  prompt_template_path: configs/curation/llm_prompt_template.txt
  fail_on_unreachable: false

tier_refine:
  reassignment_enabled: true
  reassignment_min_neighbor_count: 3
  reassignment_similarity_floor: 0.50
  uberon_table_path: data/cache/harvest/uberon_organs.parquet
  organ_default: universal

canonicalize:
  id_offset: 10000
  sentence_case: true

prompt_gen:
  species:
    - Homo_sapiens
    - Mus_musculus
  templates_path: configs/curation/prompt_templates.yaml

negative_classes:
  disease_bioportal_acronym: NCIT
  disease_subtree_iri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C2991"
  disease_ncit_fallback_iri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C2991"
  disease_max_terms: 500
  anatomy_uberon_path: data/cache/harvest/uberon_organs.parquet
  anatomy_max_terms: 500
  procedure_ncit_iri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C25218"
  procedure_max_terms: 300
  clinical_metadata_yaml: configs/curation/negative_classes.yaml
  cache_dir: data/cache/negative_classes
